name: Test multiple destination tags (CSV)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pull repo-copy image in advance
        run: docker pull akhilerm/repo-copy:latest || true
      - id: action
        uses: .
        with:
          src: hello-world:latest
          dst: |
            localhost:5000/hello-world:v1
            localhost:5000/hello-world:latest
        continue-on-error: true
      - name: Assert action ran with multiple destinations (succeeds or fails gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with multiple destinations"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without registry credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
